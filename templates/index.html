<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiGen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>🎓 CertiGen</h1>
            <p>Professional certificate template designer and bulk generator.</p>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            <label>Upload Certificate Template</label>
            <input type="file" name="certificate" required>

            <label>Upload Excel File</label>
            <input type="file" name="excel" required>

            <a href="/designer" target="_blank">
                <button type="button">🖱 Open Designer</button>
            </a>

            <button type="submit">🚀 Generate Certificates</button>
        </form>
    </div>
</body>
</html>
